services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_ppt
      MYSQL_USER: aippt
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aippt_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD:-change_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
  ai-ppt:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ai_ppt?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: aippt
      DB_PASSWORD: ${MYSQL_PASSWORD:-aippt_password}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen-plus}
      GENERATION_PARALLELISM: ${GENERATION_PARALLELISM:-4}
    depends_on:
      mysql: {condition: service_healthy}
volumes:
  mysql-data:

